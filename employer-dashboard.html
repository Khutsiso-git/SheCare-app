<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SheCare - Dashboard</title>
<style>
  body { background: #f5f5f5; font-family: Arial; padding: 15px; margin:0; }
  h1 { color: #000; text-align: center; }
  h1 span { color: #E65100; }
  .user-card {
    background: #fff;
    border: 2px solid #000;
    border-left: 6px solid #E65100;
    border-radius: 15px;
    padding: 15px;
    margin: 15px auto;
    max-width: 700px;
    display: flex;
    gap: 15px;
    align-items: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .avatar {
    width: 60px;
    height: 60px;
    background: #000;
    color: #E65100;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 20px;
    flex-shrink: 0;
  }
  .info { flex: 1; }
  .info h3 { margin: 0 0 8px 0; color: #000; }
  .info p { margin: 3px 0; font-size: 13px; color: #333; }
  .label { color: #E65100; font-weight: bold; }
  .back-btn {
    display: block;
    margin: 20px auto;
    background: #000;
    color: #fff;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
  }
  .back-btn:hover { background: #E65100; }
</style>
</head>
<body>

<h1>She<span>Care</span> Dashboard</h1>

<div id="dashboard"></div>

<button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>

<script>
// Get users
let users = JSON.parse(localStorage.getItem('users')) || [];

// FIX: Migrate old Study to Work-type so no undefined
users = users.map(u => {
  if (!u.workType && !u['Work-type']) {
    u.workType = u.study || u.Study || 'full time';
  }
  return u;
});
localStorage.setItem('users', JSON.stringify(users));

// Show cards WITH pictures
document.getElementById('dashboard').innerHTML = users.map(user => {
  let initials = (user.name || 'TU').substring(0,2).toUpperCase();
  return `
  <div class="user-card">
    <div class="avatar">${initials}</div>
    <div class="info">
      <h3>${user.name || 'test user'}</h3>
      <p><span class="label">SA ID:</span> ${user.saId || user.saID || 'N/A'}</p>
      <p><span class="label">Email:</span> ${user.email}</p>
      <p><span class="label">City:</span> ${user.city} | <span class="label">Work-type:</span> ${user.workType}</p>
      <p><span class="label">Address:</span> ${user.address || 'N/A'}</p>
      <p><span class="label">Citizen:</span> ${user.citizen || 'N/A'} | <span class="label">Disability:</span> ${user.disability || 'N/A'}</p>
    </div>
  </div>
  `;
}).join('');
</script>

</body>
</html>
