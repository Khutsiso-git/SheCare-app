<!DOCTYPE html>
<html>
<head>
  <title>SheCare Dashboard</title>
  <style>
    body{ font-family:Arial; background:#f8f9fa; margin:0; padding:20px; text-align:center; }
    h1{ margin-top:20px; }
    h1 span{ color:#ff6a00; }
    .search-box{ margin:20px auto; max-width:500px; display:flex; gap:10px; justify-content:center; }
    .search-box input{ flex:1; padding:12px 18px; border-radius:25px; border:1px solid #ddd; outline:none; }
    .search-box button{ padding:12px 20px; border-radius:25px; border:none; background:#ff6a00; color:white; cursor:pointer; }
    .card{ max-width:600px; margin:15px auto; background:white; border:2px solid #111; border-left:6px solid #ff6a00; border-radius:12px; padding:15px 20px; display:flex; gap:15px; text-align:left; align-items:center; }
    .card img{ width:70px; height:70px; border-radius:50%; object-fit:cover; }
    .card b{ font-size:16px; }
    .card p{ margin:3px 0; font-size:13px; }
    .label{ color:#ff6a00; font-weight:bold; }
    .btn{ background:black; color:white; padding:10px 20px; border-radius:25px; text-decoration:none; display:inline-block; margin:10px; border:none; cursor:pointer; }
  </style>
</head>
<body>

<h1>She<span>Care</span> Dashboard</h1>

<!-- SEARCH BAR FOR EMPLOYERS -->
<div class="search-box">
  <input type="text" id="searchCity" placeholder="Search caregiver by city e.g. Pretoria, Johannesburg..." onkeyup="filterByCity()">
  <button onclick="filterByCity()">🔍 Search</button>
  <button onclick="showAll()" style="background:#333;">Show All</button>
</div>
<p id="resultCount" style="color:#666; font-size:13px;"></p>

<div id="dashboardContainer"></div>

<a href="index.html" class="btn">← Back to Home</a>
<br>
<button class="btn" style="background:#888;" onclick="clearData()">Clear Test Data</button>

<script>
let allUsers = JSON.parse(localStorage.getItem('users')) || [];

function render(users){
  const container = document.getElementById('dashboardContainer');
  const count = document.getElementById('resultCount');
  
  if(users.length === 0){
    container.innerHTML = "<p>No caregivers found for that location.</p>";
    count.textContent = "";
    return;
  }
  
  count.textContent = `Found ${users.length} caregiver(s)`;
  
  container.innerHTML = users.map(u => `
    <div class="card">
      ${u.photo ? `<img src="${u.photo}">` : `<div style="width:70px;height:70px;border-radius:50%;background:#ff6a00;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;">${(u.name||'L').charAt(0)}</div>`}
      <div>
        <b>${u.name || u.fullNames || 'No Name'}</b>
        <p><span class="label">SA ID:</span> ${u.saId || ''}</p>
        <p><span class="label">Email:</span> ${u.email || ''}</p>
        <p><span class="label">City:</span> ${u.city || ''} | <span class="label">Work-type:</span> ${u.workType || ''}</p>
        <p><span class="label">Address:</span> ${u.address || ''}</p>
        <p><span class="label">Citizen:</span> ${u.citizen || ''} | <span class="label">Disability:</span> ${u.disability || ''}</p>
      </div>
    </div>
  `).join('');
}

// Initial load
render(allUsers);

// SEARCH FUNCTION
function filterByCity(){
  const query = document.getElementById('searchCity').value.toLowerCase().trim();
  if(!query){ render(allUsers); return; }
  
  const filtered = allUsers.filter(u => 
    (u.city && u.city.toLowerCase().includes(query)) ||
    (u.address && u.address.toLowerCase().includes(query))
  );
  render(filtered);
}

function showAll(){
  document.getElementById('searchCity').value = "";
  render(allUsers);
}

function clearData(){
  if(confirm("Clear all test users?")){
    localStorage.removeItem('users');
    location.reload();
  }
}
</script>
</body>
</html>
