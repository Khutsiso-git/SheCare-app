<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SheCare - Dashboard</title>
<style>
  body { background: #f5f5f5; font-family: Arial; padding: 15px; margin:0; }
  h1 { color: #000; text-align: center; }
  h1 span { color: #E65100; }
  .user-card {
    background: #fff;
    border: 2px solid #000;
    border-left: 6px solid #E65100;
    border-radius: 15px;
    padding: 15px;
    margin: 15px auto;
    max-width: 700px;
    display: flex;
    gap: 15px;
    align-items: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .avatar {
    width: 65px;
    height: 65px;
    background: #000;
    color: #E65100;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 20px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .info { flex: 1; }
  .info h3 { margin: 0 0 8px 0; color: #000; }
  .info p { margin: 3px 0; font-size: 13px; color: #333; }
  .label { color: #E65100; font-weight: bold; }
  .back-btn {
    display: block;
    margin: 20px auto;
    background: #000;
    color: #fff;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
  }
  .back-btn:hover { background: #E65100; }
  .empty-msg { text-align:center; margin-top:50px; color:#666; }
</style>
</head>
<body>

<h1>She<span>Care</span> Dashboard</h1>

<div id="dashboard"></div>

<button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>
<button class="back-btn" onclick="clearData()" style="background:#888;">Clear Test Data</button>

<script>
// Get users
let users = JSON.parse(localStorage.getItem('users')) || [];

// FIX: Migrate old data so no "undefined"
users = users.map(u => {
  if (!u.workType) {
    u.workType = u.study || u.Study || u['Work-type'] || 'full time';
  }
  if (!u.saId) {
    u.saId = u.saID || 'N/A';
  }
  return u;
});

const dashboardDiv = document.getElementById('dashboard');

if (users.length === 0) {
  dashboardDiv.innerHTML = `<div class="empty-msg"><h3>No caregivers yet</h3><p>Go to Register and add 1 user to test.</p></div>`;
} else {
  // Show newest first
  dashboardDiv.innerHTML = users.reverse().map(user => {
    let initials = (user.name || 'TU').substring(0,2).toUpperCase();
    
    // Photo logic - if user has photo, show it
    let avatarContent = initials;
    if (user.photo) {
      avatarContent = `<img src="${user.photo}" alt="photo">`;
    }

    return `
    <div class="user-card">
      <div class="avatar">${avatarContent}</div>
      <div class="info">
        <h3>${user.name || 'test user'}</h3>
        <p><span class="label">SA ID:</span> ${user.saId || 'N/A'}</p>
        <p><span class="label">Email:</span> ${user.email}</p>
        <p><span class="label">City:</span> ${user.city || 'N/A'} | <span class="label">Work-type:</span> ${user.workType}</p>
        <p><span class="label">Address:</span> ${user.address || 'N/A'}</p>
        <p><span class="label">Citizen:</span> ${user.citizen || 'N/A'} | <span class="label">Disability:</span> ${user.disability || 'N/A'}</p>
      </div>
    </div>
    `;
  }).join('');
}

function clearData(){
  if(confirm('Delete all test users?')){
    localStorage.removeItem('users');
    location.reload();
  }
}
</script>

</body>
</html>
