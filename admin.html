<!DOCTYPE html>
<html>
<head>
<title>Admin - SheCare Applicants</title>
<link rel="stylesheet" href="shecare.css">
<style>
  /* === NO MORE PINK - ONLY ORANGE #FF6A00 === */
  body {
   
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  h1 {
    color: #FF6A00 !important;
    text-align: center;
    margin-top: 20px;
  }
  .count {
    text-align: center;
    font-weight: bold;
    margin: 15px 0;
  }
  table {
    width: 95%;
    margin: 20px auto;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  table th {
    background: #FF6A00 !important;
    background-color: #FF6A00 !important;
    color: white !important;
    padding: 12px 8px;
    text-align: left;
  }
  table td {
    padding: 10px 8px;
    border-bottom: 1px solid #eee;
  }
  .btn {
    background: #FF6A00 !important;
    color: white !important;
    border: none !important;
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    margin: 5px;
  }
  .btn:hover {
    background: #e05e00 !important;
  }
</style>
</head>
<body>

<h1>SheCare_ Admin Dashboard 🧡</h1>
<div class="count" id="totalCount">Loading...</div>
  
<table>
  <thead>
    <tr>
      <th>Full Names</th>
      <th>Email</th>
      <th>SA ID</th>
      <th>SA Citizen</th>
      <th>City</th>
      <th>Disability</th>
      <th>Address</th>
    </tr>
  </thead>
  <tbody id="tableBody">
    <tr><td colspan="7" style="text-align:center">Loading applicants...</td></tr>
  </tbody>
</table>

<br>
<div style="text-align:center">
  <a href="register.html"><button class="btn">Go to Register</button></a>
  <a href="Login.html"><button class="btn">Go to Login</button></a>
</div>

</body>
</html>
