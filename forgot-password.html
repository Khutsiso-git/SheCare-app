<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password - SheCare</title>
  <link rel="stylesheet" href="shecare.css">
</head>
<body class="register">

  <h2>Reset Password_</h2>

  <div class="register-form">
    <div id="step1">
      <input type="email" id="resetEmail" placeholder="Enter your registered Email" required>
      <button class="btn" onclick="checkEmail()">Check Email</button>
    </div>

    <div id="step2" style="display:none; margin-top: 20px;">
      <input type="password" id="newPassword" placeholder="Enter New Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
      <button class="btn" onclick="updatePassword()">Update Password</button>
    </div>
  </div>

  <p style="text-align:center; margin-top:15px;">
    <a href="Login.html" style="color: #ff6a00; font-weight: bold;">Back to Login</a>
  </p>

  <footer style="text-align: center; padding: 20px; color: #333; font-size: 14px; margin-top: 50px;">
    <p>Copyright © <span id="year"></span> SheCare_ All rights reserved.</p>
  </footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7-8wsiRZdO21N-Q1Ownlyt54hlSVX-ao",
  authDomain: "javascript-f6b0d.firebaseapp.com",
  projectId: "javascript-f6b0d",
  storageBucket: "javascript-f6b0d.firebasestorage.app",
  messagingSenderId: "986424458897",
  appId: "1:986424458897:web:2c9a68fbf424bff4020930"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('year').textContent = new Date().getFullYear();

let foundDocId = null;

window.checkEmail = async () => {
  const email = document.getElementById('resetEmail').value.trim();
  if(!email) return alert("Enter email");

  const q = query(collection(db, "registrations"), where("email", "==", email));
  const snapshot = await getDocs(q);

  if(snapshot.empty){
    alert("❌ No account with that email");
  } else {
    snapshot.forEach(d => foundDocId = d.id);
    alert("✅ Email found! Now set new password");
    document.getElementById('step2').style.display = 'block';
  }
};

window.updatePassword = async () => {
  const newPass = document.getElementById('newPassword').value;
  const confirmPass = document.getElementById('confirmPassword').value;

  if(newPass.length < 6) return alert("Password must be at least 6 characters");
  if(newPass !== confirmPass) return alert("Passwords do not match!");

  try {
    await updateDoc(doc(db, "registrations", foundDocId), {
      password: newPass
    });
    alert("✅ Password Updated! Go login now");
    window.location.href = "Login.html";
  } catch(err){
    alert("Error: " + err.message);
  }
};
</script>
</body>
</html>
