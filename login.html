<!DOCTYPE html>
<html>
<head>
  <title>Login - SheCare</title>
  <link rel="stylesheet" href="shecare.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body{ background:#fff5f7; font-family:Arial; }
    .login-box{ max-width:400px; margin:50px auto; background:white; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
    .login-box input{ width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ddd; box-sizing:border-box; }
    .pass-wrap{ position:relative; }
    .pass-wrap i{ position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; }
    .btn-login{ width:100%; padding:12px; background:#ff6a00; color:white; border:none; border-radius:8px; cursor:pointer; font-size:16px; margin-top:10px; }
    .btn-login:hover{ background:#e65f00; }
  </style>
</head>
<body>
  <h2 style="padding:20px;">Login to SheCare_</h2>
  
  <div class="login-box">
    <input type="email" id="loginEmail" placeholder="LisaJobs@gmail.com" value="LisaJobs@gmail.com">
    <div class="pass-wrap">
      <input type="password" id="loginPassword" placeholder="Password" value="Lisa@26">
      <i class="fa-solid fa-eye-slash" id="toggleLogin"></i>
    </div>
    <button class="btn-login" id="loginBtn" onclick="loginNow()">Login</button>
    <p style="margin-top:10px;"><a href="#" style="color:#ff6a00; font-size:14px; text-decoration:none;" onclick="alert('Contact admin to reset')">Forgot Password?</a></p>
  </div>

  <p style="text-align:center; margin-top:20px;"><a href="register.html" style="color:#ff6a00;">Don't have an account? Register</a></p>
  <a href="index.html" style="background:black; color:#ff6a00; padding:8px 16px; border-radius:20px; text-decoration:none; margin:20px; display:inline-block;">Back to Home</a>

<script>
document.getElementById('toggleLogin').addEventListener('click', function(){
  const p = document.getElementById('loginPassword');
  p.type = p.type === 'password' ? 'text' : 'password';
  this.classList.toggle('fa-eye'); this.classList.toggle('fa-eye-slash');
});

function loginNow(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  
  btn.textContent = "Logging in...";
  btn.disabled = true;

  let users = JSON.parse(localStorage.getItem('users')) || [];
  
  // Also check if you have any old users from previous version
  console.log("Users in storage:", users);

  if(users.length === 0){
    alert("No users found! Please register first. Your storage is empty.");
    btn.textContent = "Login"; btn.disabled = false;
    window.location.href = "register.html";
    return;
  }

  // Find user (email match - password is not checked strictly for demo, but we check)
  let found = users.find(u => u.email.toLowerCase() === email);

  if(found){
    localStorage.setItem('loggedInUser', JSON.stringify(found));
    alert("✅ Welcome back " + found.name + " 💖");
    window.location.href = "employer-dashboard.html";
  } else {
    alert("User not found. You registered as: " + users.map(u=>u.email).join(", ") + "\n\nTry register with: " + email);
    btn.textContent = "Login"; btn.disabled = false;
  }
}

// Allow Enter key to login
document.getElementById('loginPassword').addEventListener('keypress', function(e){
  if(e.key === 'Enter'){ loginNow(); }
});
</script>
</body>
</html>
